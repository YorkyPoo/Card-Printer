<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riley Flash Cards - Print Layout</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @page {
            size: letter;
            margin: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            margin: 0;
            padding: 0;
        }

        .page {
            width: 215.9mm;
            height: 279.4mm;
            background: white;
            page-break-after: always;
            position: relative;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page:last-child {
            page-break-after: auto;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 63mm);
            grid-template-rows: repeat(3, 88mm);
            gap: 0;
            width: 189mm; /* 3 * 63mm */
            height: 264mm; /* 3 * 88mm */
        }

        .card {
            width: 63mm;
            height: 88mm;
            border: 1px solid #ddd;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
        }

        .card img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
        }

        @media print {
            body {
                background: white;
            }

            .card {
                border: 1px solid #ccc;
            }
        }

        @media screen {
            body {
                padding: 20px;
            }

            .page {
                margin: 20px auto;
                box-shadow: 0 0 10px rgba(0,0,0,0.1);
            }
        }
    </style>
</head>
<body>
    <!-- Page 1 -->
    <div class="page">
        <div class="grid">
            <div class="card"><img src="1-1-1 Rule.png" alt="Card 1"></div>
            <div class="card"><img src="Bat.png" alt="Card 2"></div>
            <div class="card"><img src="Bed Hands.png" alt="Card 3"></div>
            <div class="card"><img src="Bed.png" alt="Card 4"></div>
            <div class="card"><img src="c1.png" alt="Card 5"></div>
            <div class="card"><img src="c2.png" alt="Card 6"></div>
            <div class="card"><img src="c3.png" alt="Card 7"></div>
            <div class="card"><img src="c4.png" alt="Card 8"></div>
            <div class="card"><img src="c5.png" alt="Card 9"></div>
        </div>
    </div>

    <!-- Page 2 -->
    <div class="page">
        <div class="grid">
            <div class="card"><img src="c6.png" alt="Card 10"></div>
            <div class="card"><img src="c7.png" alt="Card 11"></div>

            <div class="card"><img src="c9.png" alt="Card 13"></div>
            <div class="card"><img src="Compound words.png" alt="Card 14"></div>
            <div class="card"><img src="CVC.png" alt="Card 15"></div>
            <div class="card"><img src="Donut.png" alt="Card 16"></div>
            <div class="card"><img src="Floss Rule.png" alt="Card 17"></div>
            <div class="card"><img src="Gentle Cindy.png" alt="Card 18"></div>
        </div>
    </div>

    <!-- Page 3 -->
    <div class="page">
        <div class="grid">
            <div class="card"><img src="Generated Image November 08, 2025 - 12_13AM.png" alt="Card 19"></div>
            <div class="card"><img src="Generated Image November 08, 2025 - 12_13AM (1).png" alt="Card 20"></div>
            <div class="card"><img src="Generated Image November 08, 2025 - 12_14AM (4).png" alt="Card 21"></div>
            <div class="card"><img src="Generated Image November 08, 2025 - 12_14AM (5).png" alt="Card 22"></div>
            <div class="card"><img src="Generated Image November 08, 2025 - 12_14AM (6).png" alt="Card 23"></div>
            <div class="card"><img src="Generated Image November 08, 2025 - 12_14AM (7).png" alt="Card 24"></div>
            <div class="card"><img src="Hard C Kite.png" alt="Card 25"></div>
            <div class="card"><img src="Rabbit Rule.png" alt="Card 26"></div>

    <!-- Page 4 -->

            <div class="card"></div>
            <div class="card"></div>
            <div class="card"></div>
            <div class="card"></div>

        </div>
    </div>
</body>
</html>
